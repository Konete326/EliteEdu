<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" id="dynamic-theme-color" content="#09090b" />
    <meta name="application-name" content="EliteEdu" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="EliteEdu" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>EliteEdu</title>
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('elite_theme_settings');
          var theme = raw ? JSON.parse(raw) : null;
          var mode = (theme && theme.mode) || localStorage.getItem('theme') || 'light';
          var isDark = mode === 'dark';
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.setAttribute('data-bs-theme', 'dark');
            root.style.backgroundColor = '#09090b';
          } else {
            root.classList.remove('dark');
            root.setAttribute('data-bs-theme', 'light');
            root.style.backgroundColor = '#f2f5f6';
          }
          var tc = document.getElementById('dynamic-theme-color');
          if (tc) tc.setAttribute('content', isDark ? '#09090b' : '#ffffff');
          if (theme && theme.activeColor) {
            root.style.setProperty('--color-primary', theme.activeColor);
          }
          if (theme && theme.headerBg) {
            root.setAttribute('data-header-bg', theme.headerBg);
            root.setAttribute('data-sidebar-bg', theme.sidebarBg || theme.headerBg);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="pwa-splash" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:99999;" class="bg-surface dark:bg-[#09090b]"></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
