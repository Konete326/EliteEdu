<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#863bff" />
    <meta name="application-name" content="EliteEdu" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EliteEdu" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>EliteEdu</title>
  </head>
  <body class="bg-[#09090b] text-[#fafafa]">
    <div id="root">
      <div id="pwa-splash" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#09090b;color:#fafafa;font-family:system-ui,-apple-system,sans-serif;z-index:99999;">
        <img src="/logo.png" alt="EliteEdu" style="width:68px;height:68px;object-fit:contain;margin-bottom:20px;animation:pwaPulse 1.8s infinite ease-in-out;" />
        <div style="width:130px;height:3px;background:rgba(255,255,255,0.12);border-radius:99px;overflow:hidden;position:relative;">
          <div style="position:absolute;inset:0;width:40%;background:linear-gradient(90deg,#863bff,#a855f7);border-radius:99px;animation:pwaSlide 1.4s infinite ease-in-out;"></div>
        </div>
      </div>
      <style>
        @keyframes pwaPulse{0%,100%{transform:scale(1);opacity:0.92}50%{transform:scale(1.04);opacity:1}}
        @keyframes pwaSlide{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
